[project]
name = "nc-wer-backend"
version = "0.1.0"
description = "NC WER Analysis API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "jiwer>=3.0.5",
    "numpy>=2.1.0",
    "soundfile>=0.12.1",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
# Forced alignment (torchaudio MMS_FA) for createdAt-independent turn windows.
align = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "uroman>=1.3.1",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
